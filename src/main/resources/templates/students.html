<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student List - SMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-4 mb-4">
        <span class="navbar-brand h1 m-0">Student Management System</span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
        </form>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Student List</h2>
            <a th:href="@{/students/new}" class="btn btn-success">+ Add Student</a>
        </div>

        <table class="table table-striped table-bordered shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th class="text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="student : ${students}" >
                    <td th:text="${student.id}" ></td>
                    <td th:text="${student.firstName}"></td>
                    <td th:text="${student.lastName}"></td>
                    <td th:text="${student.email}"></td>
                    <td th:text="${student.course}"></td>
                    <td class="text-center">
                    	<a th:href="@{/students/view/{id}(id=${student.id})}" class="btn btn-secondary btn-sm me-1">View</a>
                        <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-primary btn-sm me-1">Edit</a>
                        <a th:href="@{/students/{id}(id=${student.id})}" 
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this student?');">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(students)}">
                    <td colspan="6" class="text-center text-muted">No students found. Click "Add Student" to create one.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
