<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Book Details</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<div class="container mt-5" style="max-width: 600px;">

    <h1 class="mb-4">STUDENTS DETAILS</h1>

    <div class="card shadow-sm">

        <div class="card-body">

            <p>
                <strong>ID:</strong>
                <span th:text="${studentdetail.id}"></span>
            </p>

            <p>
                <strong>Name:</strong>
                <span th:text="${studentdetail.firstName}"></span>
            </p>

            <p>
                <strong>Age:</strong>
                <span th:text="${studentdetail.lastName}"></span>
            </p>

            <p>
                <strong>Course:</strong>
                <span th:text="${studentdetail.email}"></span>
            </p>

            <p>
                <strong>Student Group:</strong>
                <span th:text="${studentdetail.course}"></span>
            </p>

            <a th:href="@{/}"
               class="btn btn-secondary">
                Back
            </a>

        </div>

    </div>

</div>

</body>
</html>
