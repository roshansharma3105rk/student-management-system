<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - SMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .login-card { max-width: 400px; margin: 100px auto; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="card shadow-sm login-card">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-4 text-primary">SMS Login</h3>
            
            <div th:if="${param.error}" class="alert alert-danger p-2 fs-6 text-center">
                Invalid username or password.
            </div>
            
            <div th:if="${param.logout}" class="alert alert-success p-2 fs-6 text-center">
                Logged out successfully.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
